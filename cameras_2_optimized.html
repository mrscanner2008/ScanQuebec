<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caméras MTQ — ScanQC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap"></noscript>
<style>
:root{
  --black:#080c0a;--deep:#0a1210;--panel:#0f1a16;--card:#121f1a;--border:#1e3028;
  --green:#00ff88;--green-dim:#00c866;--green-faint:rgba(0,255,136,0.07);--green-glow:rgba(0,255,136,0.18);
  --amber:#ffaa00;--red:#ff3344;--cyan:#00e5ff;
  --text:#c8ddd5;--text-dim:#6a8a7a;
  --mono:'Share Tech Mono',monospace;--cond:'Barlow Condensed',sans-serif;--body:'Barlow',sans-serif;
}
[data-theme="light"]{
  --black:#ffffff;--deep:#f5f7f6;--panel:#eef2f0;--card:#e8edeb;--border:#c8d8d2;
  --green:#00994d;--green-dim:#007a3d;--green-faint:rgba(0,153,77,0.09);
  --amber:#b37400;--red:#cc1122;--text:#111c17;--text-dim:#3d5c4e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--black);color:var(--text);font-family:var(--body);min-height:100%}

/* ── TOOLBAR ─────────────────────────────────────────────────── */
.toolbar{position:sticky;top:0;z-index:100;background:rgba(8,12,10,0.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding:0.5rem 0.8rem;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
[data-theme="light"] .toolbar{background:rgba(255,255,255,0.96)}
.fbtn{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;
  padding:0.28rem 0.65rem;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap}
.fbtn:hover{color:var(--green);border-color:rgba(0,255,136,0.3)}
.fbtn.active{background:var(--green-faint);color:var(--green);border-color:rgba(0,255,136,0.4)}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:0.5rem;flex-shrink:0}
.cam-count{font-family:var(--mono);font-size:0.58rem;color:var(--text-dim)}
.rbtn{font-family:var(--mono);font-size:0.6rem;padding:0.28rem 0.7rem;background:transparent;
  border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:.15s}
.rbtn:hover{color:var(--green);border-color:var(--green)}

/* PERF: Ops link — static SVG thumbnail, eliminates recursive iframe load of entire app */
.ops-link{display:flex;align-items:center;gap:0.45rem;text-decoration:none;
  border:1px solid rgba(0,255,136,0.25);padding:0.22rem 0.55rem 0.22rem 0.3rem;
  background:var(--green-faint);transition:all .18s;flex-shrink:0}
.ops-link:hover{border-color:var(--green);background:rgba(0,255,136,0.12)}
.ops-thumb{width:38px;height:22px;border:1px solid rgba(0,255,136,0.2);
  overflow:hidden;position:relative;background:var(--deep);flex-shrink:0;border-radius:1px}
.ops-label{display:flex;flex-direction:column;line-height:1.2}
.ops-label .ol-top{font-family:var(--mono);font-size:0.58rem;color:var(--green);
  letter-spacing:0.1em;text-transform:uppercase;font-weight:700}
.ops-label .ol-sub{font-family:var(--mono);font-size:0.5rem;color:var(--text-dim);letter-spacing:0.06em}

/* ── SUB-BAR ─────────────────────────────────────────────────── */
.sub-bar{background:var(--deep);border-bottom:1px solid var(--border);
  padding:0.35rem 0.8rem;display:none;flex-wrap:wrap;gap:3px}
.sub-bar.on{display:flex}

/* ── STATUS ──────────────────────────────────────────────────── */
.status{padding:0.3rem 0.8rem;background:var(--deep);border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:0.58rem;color:var(--text-dim);
  display:flex;align-items:center;gap:0.6rem}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 5px var(--green);flex-shrink:0;animation:sdotpulse 1.8s ease-in-out infinite}
@keyframes sdotpulse{0%,100%{opacity:1}50%{opacity:0.35}}

/* ── GRID ────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1px;background:var(--border)}
/* Cap at 5 columns regardless of screen width */
@media (min-width:1060px){.grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:860px) and (max-width:1059px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:640px) and (max-width:859px) {.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:420px) and (max-width:639px) {.grid{grid-template-columns:repeat(2,1fr)}}
.sec-hdr{grid-column:1/-1;font-family:var(--cond);font-size:0.85rem;font-weight:700;
  letter-spacing:0.15em;text-transform:uppercase;color:var(--green);
  padding:0.6rem 0.8rem 0.3rem;border-bottom:1px solid var(--border);background:var(--deep)}

/* ── CAMERA CARD ─────────────────────────────────────────────── */
.cam-card{background:var(--card);cursor:pointer;border:1px solid transparent;
  transition:border-color .15s}
.cam-card:hover{border-color:var(--green-dim)}
[data-theme="light"] .cam-card{background:#fff}

/* Video viewport */
.vp{position:relative;aspect-ratio:16/9;background:#050d09;overflow:hidden}

/* PERF: video hidden until stream starts — avoids layout shift flash */
.vp video{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .4s;
  /* contain: paint prevents offscreen compositing */
  contain:paint;
}
.vp video.playing{opacity:1}

/* Placeholder shown until video plays */
.cam-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0.4rem;color:var(--text-dim);
  font-family:var(--mono);font-size:0.52rem;letter-spacing:0.08em;
  pointer-events:none;transition:opacity .3s;
}
.cam-ph.hidden{opacity:0}
.cam-ph svg{opacity:0.2}

.vp-overlay{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
  padding:0.3rem 0.45rem;background:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent);
  pointer-events:none}
.live{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.12em;color:#fff;
  display:flex;align-items:center;gap:0.25rem}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--green);
  animation:sdotpulse 1.8s ease-in-out infinite}
.cam-ts{position:absolute;bottom:0;right:0;font-family:var(--mono);font-size:0.48rem;
  color:rgba(255,255,255,0.45);background:rgba(0,0,0,0.45);padding:0.1rem 0.35rem}

.cam-info{padding:0.4rem 0.6rem;display:flex;flex-direction:column;gap:0.1rem}
.cam-name{font-size:0.75rem;color:var(--text);line-height:1.25}
.cam-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:0.52rem}
.cam-reg{color:var(--green-dim)}
.cam-id{color:rgba(106,138,122,0.4)}

/* ── MODAL ───────────────────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.93);
  display:flex;align-items:center;justify-content:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--panel);border:1px solid var(--border);max-width:800px;width:100%;
  transform:translateY(8px);transition:transform .22s}
.modal-bg.open .modal{transform:none}
[data-theme="light"] .modal{background:#fff}
.mhdr{display:flex;align-items:center;justify-content:space-between;
  padding:0.6rem 0.9rem;border-bottom:1px solid var(--border);background:var(--card)}
[data-theme="light"] .mhdr{background:#f5f7f6}
.mhdr-title{font-family:var(--cond);font-size:0.95rem;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;color:#fff}
[data-theme="light"] .mhdr-title{color:#111}
.mclose{background:none;border:none;color:var(--text-dim);font-size:1rem;
  cursor:pointer;padding:0.2rem 0.5rem;font-family:var(--mono)}
.mclose:hover{color:var(--red)}
.mvideo{width:100%;aspect-ratio:16/9;background:#000;display:block}
.mmeta{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:1px;background:var(--border);font-family:var(--mono);font-size:0.65rem}
.mmeta div{background:var(--card);padding:0.45rem 0.7rem;display:flex;flex-direction:column;gap:0.1rem}
[data-theme="light"] .mmeta div{background:#f5f7f6}
.mmeta label{font-size:0.52rem;letter-spacing:0.12em;color:var(--text-dim);text-transform:uppercase}
</style>
</head>

/* ═══════════════════════════════════════════════════════════════
   INTERSECTION OBSERVER — lazy autoplay + offscreen pause

   Two observers:
   1. playObs  — fires when video enters viewport (+200px ahead).
                 Sets src and calls play(). Unobserves after load.
   2. pauseObs — fires when video scrolls 300px past viewport edge.
                 Pauses to free bandwidth. Re-registers with playObs.

   Net effect: at any moment only ~4–8 visible videos are streaming.
   Previously: ALL videos in the DOM streamed simultaneously.
   ═══════════════════════════════════════════════════════════════ */
let playObs, pauseObs;

function initObservers() {
  // Disconnect any previous observers (called after each render)
  if (playObs)  playObs.disconnect();
  if (pauseObs) pauseObs.disconnect();

  playObs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const v = e.target;
      // Assign src on first entry — triggers network request
      if (!v._srcSet) {
        v._srcSet = true;
        const src = document.createElement('source');
        src.type = 'video/mp4';
        src.src  = VID_URL(v.dataset.id) + '?_t=' + _refreshToken;
        v.appendChild(src);
        v.load();
      }
      v.play().catch(() => {});
      v.addEventListener('canplay', () => {
        v.classList.add('playing');
        const ph = v.parentElement.querySelector('.cam-ph');
        if (ph) ph.classList.add('hidden');
      }, {once: true});
      // Once playing, stop watching for entry — pauseObs handles the rest
      playObs.unobserve(v);
    });
  }, { rootMargin: '200px 0px' }); // pre-load 200px before visible

  pauseObs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting && !e.target.paused) {
        e.target.pause();
        // Re-register with playObs so it resumes when scrolled back
        playObs.observe(e.target);
      }
    });
  }, { rootMargin: '-300px 0px' }); // pause when 300px offscreen
}

function observeVideos() {
  document.querySelectorAll('.vp video[data-id]').forEach(v => {
    playObs.observe(v);
    pauseObs.observe(v);
  });
}

   ═══════════════════════════════════════════════════════════════ */
function setF(f, btn) {
  curF = f; curSub = null;
  document.querySelectorAll('#mf .fbtn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (f !== 'quebec') document.getElementById('sb').classList.remove('on');
  render();
}

function toggleQC(btn) {
  curF = 'quebec'; curSub = 'all-qc';
  document.querySelectorAll('#mf .fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sb').classList.toggle('on');
  document.querySelectorAll('#sb .fbtn').forEach(b => b.classList.remove('active'));
  render();
}

function setSub(s, btn) {
  curSub = s;
  document.querySelectorAll('#sb .fbtn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function getFiltered() {
  if (curF === 'all') return cameras;
  if (curF === 'quebec') {
    const qc = cameras.filter(c => c.r === 'quebec');
    if (curSub && curSub !== 'all-qc') return qc.filter(c => c.sub === curSub);
    return qc;
  }
  return cameras.filter(c => c.r === curF);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   Single innerHTML write per render. Observers re-attached after.
   ═══════════════════════════════════════════════════════════════ */
function buildCard(cam) {
  const name = cam.fr;
  const reg  = cam.sub ? cam.sub.replace('qc-','').toUpperCase() : cam.r.toUpperCase();
  const ts   = new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  // PERF: video has NO src yet — IntersectionObserver assigns it on viewport entry
  return `<div class="cam-card" onclick="openCam(${cam.id})" data-id="${cam.id}">
  <div class="vp">
    <video muted loop playsinline preload="none" data-id="${cam.id}"></video>
    <div class="cam-ph">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.89L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      </svg>
      <span>Chargement…</span>
    </div>
    <div class="vp-overlay"><span class="live"><span class="ldot"></span>LIVE</span></div>
    <div class="cam-ts" id="ts-${cam.id}">${ts}</div>
  </div>
  <div class="cam-info">
    <div class="cam-name">${name}</div>
    <div class="cam-foot"><span class="cam-reg">${reg}</span><span class="cam-id">#${cam.id}</span></div>
  </div>
</div>`;
}

function render() {
  const filtered = getFiltered();
  document.getElementById('cnt').textContent = filtered.length + ' cam';

  let html = '';
  if (curF === 'quebec' && (!curSub || curSub === 'all-qc')) {
    for (const sec of QC_SECTIONS) {
      const cams = filtered.filter(c => c.sub === sec.sub);
      if (!cams.length) continue;
      html += `<div class="sec-hdr">${sec.label} <span style="font-weight:400;opacity:0.45;font-size:0.7rem">(${cams.length})</span></div>`;
      html += cams.map(buildCard).join('');
    }
    const uncat = filtered.filter(c => !c.sub);
    if (uncat.length) {
      html += `<div class="sec-hdr">Autres <span style="font-weight:400;opacity:0.45;font-size:0.7rem">(${uncat.length})</span></div>`;
      html += uncat.map(buildCard).join('');
    }
  } else {
    html = filtered.map(buildCard).join('');
  }

  // PERF: single DOM write, then set up observers on fresh elements
  document.getElementById('grid').innerHTML = html;
  initObservers();   // fresh observers for new DOM
  observeVideos();   // register all new <video> elements
}

/* ═══════════════════════════════════════════════════════════════
   REFRESH — updates src token on ALL playing videos simultaneously
   using requestAnimationFrame to batch DOM reads/writes.
   Preserves autoplay: videos that are playing stay playing.
   Schedules itself every 5 minutes via recursive setTimeout
   (unlike setInterval, skips a cycle if previous refresh is slow).
   ═══════════════════════════════════════════════════════════════ */
let _refreshToken = Date.now();
let _refreshScheduled = false;

function doRefresh() {
  _refreshToken = Date.now();

  // PERF: collect all playing videos first (read phase), then update (write phase)
  // Batching reads before writes avoids forced reflow on each iteration
  const playing = [];
  document.querySelectorAll('.vp video[data-id]').forEach(v => {
    if (v._srcSet) playing.push(v);
  });

  // Write phase — update source tokens in one pass
  playing.forEach(v => {
    const src = v.querySelector('source');
    if (src) {
      src.src = VID_URL(v.dataset.id) + '?_t=' + _refreshToken;
      v.load();
      // Only call play() on videos that were playing — preserves state for paused/offscreen
      if (!v.paused) v.play().catch(() => {});
    }
    // Update timestamp display
    const ts = document.getElementById('ts-' + v.dataset.id);
    if (ts) ts.textContent = new Date().toLocaleTimeString('fr-CA',
      {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  });

  document.getElementById('stmsg').textContent =
    `Rafraîchi ${new Date().toLocaleTimeString('fr-CA')} · ${getFiltered().length} caméras`;

  scheduleNextRefresh();
}

function scheduleNextRefresh() {
  if (_refreshScheduled) return;
  _refreshScheduled = true;
  setTimeout(() => {
    _refreshScheduled = false;
    doRefresh();
  }, 300_000); // 5 minutes
}

/* ═══════════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════════ */
function openCam(id) {
  const cam = CAM_MAP[id];
  if (!cam) return;
  document.getElementById('mtitle').textContent = cam.fr;
  const v = document.getElementById('mvid');
  v.src = VID_URL(id) + '?_t=' + Date.now();
  v.load();
  v.play().catch(() => {});
  document.getElementById('mmeta').innerHTML = `
    <div><label>ID</label>${id}</div>
    <div><label>Région</label>${(cam.r||'').toUpperCase()}</div>
    <div><label>Localisation</label>${cam.fr}</div>
    ${cam.lat ? `<div><label>Coordonnées</label>${cam.lat}°N, ${Math.abs(cam.lng)}°O</div>` : ''}
    <div><label>Source</label>Transports Québec</div>
    <div><label>Heure</label>${new Date().toLocaleString('fr-CA')}</div>`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  const v = document.getElementById('mvid');
  v.pause();
  v.src = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
