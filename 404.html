<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — ScanQC</title>
<style>
  :root {
    --black:#080c0a; --green:#00ff88; --text:#c8ddd5; --text-dim:#6a8a7a; --border:#1e3028;
    --mono:'Share Tech Mono',ui-monospace,monospace; --cond:system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--black); color:var(--text); font-family:var(--cond); text-align:center; padding:2rem;
  }
  .box { max-width:420px }
  .code { font-family:var(--mono); font-size:3rem; color:var(--green); letter-spacing:0.15em; margin-bottom:0.75rem }
  h1 { font-size:1.25rem; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:0.75rem }
  p { color:var(--text-dim); font-size:0.95rem; line-height:1.6; margin-bottom:1.5rem }
  a {
    display:inline-block; font-family:var(--mono); font-size:0.75rem; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--green); border:1px solid var(--green);
    padding:0.65rem 1.25rem; text-decoration:none;
  }
  a:hover { background:var(--green); color:#000 }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>Cette route n’existe pas sur ScanQuebec. Retourne au hub principal.</p>
    <a href="/">← Accueil ScanQC</a>
  </div>
</body>
</html>
